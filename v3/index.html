<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Frontier Echo V17</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071321;font-family:Arial;color:#fff}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none}#ver{position:fixed;right:12px;top:12px;padding:7px 10px;border-radius:9px;background:#5eeaff;color:#061018;font-weight:900}#joy{pointer-events:auto;position:fixed;left:22px;bottom:22px;width:130px;height:130px;border:2px solid #ffffff55;border-radius:50%;background:#071321aa;opacity:0;transition:opacity .12s;touch-action:none}#joy.active{opacity:1}#knob{position:absolute;left:36px;top:36px;width:54px;height:54px;border-radius:50%;background:#5eeaffbb}#attack{pointer-events:auto;position:fixed;right:24px;bottom:30px;width:88px;height:88px;border-radius:50%;border:2px solid #fff5;background:#c73b45;color:#fff;font-weight:900}#hud{position:fixed;left:12px;top:12px;padding:10px 13px;background:#07101ddd;border-radius:12px;font-weight:800}#bar{width:170px;height:7px;background:#26313a;border-radius:5px;margin-top:6px}#hp{height:100%;width:100%;background:#45e39b;border-radius:5px}</style></head><body><div id="ui"><div id="hud">ENERGY <b id="energy">0</b> · LV <b id="level">1</b><div id="bar"><div id="hp"></div></div></div><div id="ver">FRONTIER ECHO V17</div><div id="joy"><div id="knob"></div></div><button id="attack">⚔</button></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x071321);scene.fog=new THREE.Fog(0x071321,25,80);const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,150);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0x9bd7ff,0x172817,2));const sun=new THREE.DirectionalLight(0xffdfad,2.8);sun.position.set(-15,25,12);sun.castShadow=true;scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(120,120),new THREE.MeshStandardMaterial({color:0x183b2b,roughness:.9}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);function tree(x,z){const g=new THREE.Group(),t=new THREE.Mesh(new THREE.CylinderGeometry(.25,.38,2.4,8),new THREE.MeshStandardMaterial({color:0x55341f})),c=new THREE.Mesh(new THREE.ConeGeometry(1.5,3.8,9),new THREE.MeshStandardMaterial({color:0x0c4429}));t.position.y=1.2;c.position.y=3;g.add(t,c);g.position.set(x,0,z);g.traverse(o=>{if(o.isMesh)o.castShadow=true});scene.add(g)}for(let i=0;i<30;i++){const a=i*.93,d=18+i%6*4;tree(Math.cos(a)*d,Math.sin(a)*d)}const player=new THREE.Group();player.position.set(0,0,5);const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.85,8,12),new THREE.MeshStandardMaterial({color:0x246ec2}));body.position.y=1.2;const head=new THREE.Mesh(new THREE.SphereGeometry(.34,16,12),new THREE.MeshStandardMaterial({color:0xc98d67}));head.position.y=2.1;const visor=new THREE.Mesh(new THREE.BoxGeometry(.5,.14,.1),new THREE.MeshStandardMaterial({color:0x55eaff,emissive:0x114455}));visor.position.set(0,2.12,-.32);player.add(body,head,visor);scene.add(player);const crystals=[];for(let i=0;i<18;i++){const a=Math.random()*6.28,d=8+Math.random()*32,q=new THREE.Mesh(new THREE.OctahedronGeometry(.48),new THREE.MeshStandardMaterial({color:0x35eaff,emissive:0x0b3540}));q.position.set(Math.cos(a)*d,.7,Math.sin(a)*d);scene.add(q);crystals.push(q)}const enemies=[];for(let i=0;i<6;i++){const q=new THREE.Mesh(new THREE.IcosahedronGeometry(.75,1),new THREE.MeshStandardMaterial({color:0x9b2939}));q.position.set(Math.cos(i)*(12+i*3),.8,Math.sin(i)*(12+i*3));q.userData.home=q.position.clone();q.userData.hp=3;scene.add(q);enemies.push(q)}let joy={x:0,y:0},active=false,id=null,J=document.getElementById('joy'),K=document.getElementById('knob');function point(x,y){const r=J.getBoundingClientRect(),dx=x-(r.left+r.width/2),dy=y-(r.top+r.height/2),len=Math.min(48,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);joy.x=Math.cos(a)*len/48;joy.y=Math.sin(a)*len/48;K.style.left=36+joy.x*28+'px';K.style.top=36+joy.y*28+'px'}function stop(){active=false;id=null;joy={x:0,y:0};J.classList.remove('active');K.style.left='36px';K.style.top='36px'}J.addEventListener('touchstart',e=>{const t=e.changedTouches[0];active=true;id=t.identifier;J.classList.add('active');point(t.clientX,t.clientY);e.preventDefault()},{passive:false});document.addEventListener('touchmove',e=>{if(!active)return;for(const t of e.changedTouches)if(t.identifier===id){point(t.clientX,t.clientY);e.preventDefault()}},{passive:false});document.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===id){stop();e.preventDefault()}},{passive:false});document.addEventListener('touchcancel',stop,{passive:false});let energy=0,level=1,hp=100,last=performance.now();function attack(){let best=null,d=3.2;for(const e of enemies)if(e.parent){const z=e.position.distanceTo(player.position);if(z<d){d=z;best=e}}if(best){best.userData.hp--;if(best.userData.hp<=0){scene.remove(best);energy+=3}}}document.getElementById('attack').addEventListener('touchstart',e=>{e.preventDefault();attack()},{passive:false});function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;const x=joy.x,y=joy.y;if(Math.hypot(x,y)>.08){player.position.x+=x*6*dt;player.position.z+=y*6*dt;player.rotation.y=Math.atan2(x,y)}for(const q of crystals)if(q.parent){q.rotation.y+=dt*2;q.position.y=.7+Math.sin(now*.002+q.id)*.12;if(q.position.distanceTo(player.position)<1.2){scene.remove(q);energy++}}for(const e of enemies)if(e.parent){e.rotation.y+=dt;e.position.x=e.userData.home.x+Math.sin(now*.001+e.id)*1.4;e.position.z=e.userData.home.z+Math.cos(now*.0012+e.id)*1.4;if(e.position.distanceTo(player.position)<1.5)hp=Math.max(0,hp-12*dt)}camera.position.lerp(new THREE.Vector3(player.position.x,6.5,player.position.z+9),.12);camera.lookAt(player.position.x,1,player.position.z);document.getElementById('energy').textContent=energy;document.getElementById('level').textContent=level;document.getElementById('hp').style.width=hp+'%';renderer.render(scene,camera);requestAnimationFrame(loop)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></body></html>
