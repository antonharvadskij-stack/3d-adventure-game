<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Frontier Echo — V4</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050912;color:#fff;font-family:Arial}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none}#top{margin:14px;padding:12px 16px;width:max-content;background:#07101ddd;border:1px solid #5eeaff55;border-radius:14px;font-weight:800}#hp{height:7px;width:190px;background:#26313a;border-radius:8px;margin-top:7px}#fill{height:100%;width:100%;background:#45e39b;border-radius:8px}#ver{position:fixed;right:14px;top:14px;background:#5eeaff;color:#041018;padding:7px 10px;border-radius:9px;font-weight:900}#joy{pointer-events:auto;opacity:0;transition:opacity .12s;position:fixed;left:24px;bottom:28px;width:125px;height:125px;border:2px solid #ffffff44;border-radius:50%;background:#07132199}#joy.active{opacity:1}#knob{position:absolute;left:34px;top:34px;width:53px;height:53px;border-radius:50%;background:#5eeaffaa}#hit{pointer-events:auto;position:fixed;right:28px;bottom:38px;width:92px;height:92px;border-radius:50%;border:2px solid #ffb1aa;background:#c73b45;color:#fff;font-weight:900;font-size:14px}#msg{position:fixed;top:105px;left:50%;transform:translateX(-50%);background:#07101de8;padding:10px 16px;border-radius:12px;font-weight:800;opacity:0;transition:.2s}#dpad button{width:52px;height:52px;border:1px solid #ffffff44;border-radius:12px;background:#071321dd;color:#fff;font-size:22px;font-weight:900;touch-action:none}#dpad button:active{background:#35dfff;color:#06111b}</style></head><body><div id="ui"><div id="top">ENERGY <b id="energy">0</b> · LEVEL <b id="level">1</b><div id="hp"><div id="fill"></div></div></div><div id="ver">FRONTIER ECHO V11</div><div id="dpad" style="pointer-events:auto;position:fixed;left:170px;bottom:38px;z-index:9;display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px 52px;gap:5px"><button data-k="a">◀</button><button data-k="w">▲</button><button data-k="d">▶</button><span></span><button data-k="s">▼</button><span></span></div><div id="msg"></div><div id="joy"><div id="knob"></div></div><button id="hit">⚔ ATTACK</button></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const S=new THREE.Scene();S.background=new THREE.Color(0x071321);S.fog=new THREE.Fog(0x071321,28,85);
const C=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,180),R=new THREE.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,1.6));R.shadowMap.enabled=true;document.body.appendChild(R.domElement);
S.add(new THREE.HemisphereLight(0x9bd7ff,0x162817,2.2));let sun=new THREE.DirectionalLight(0xffe3b0,3);sun.position.set(-20,30,15);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);S.add(sun);
const mat=(c,e=0)=>new THREE.MeshStandardMaterial({color:c,roughness:.65,emissive:e,emissiveIntensity:e?2:0});
let g=new THREE.Mesh(new THREE.PlaneGeometry(120,120),mat(0x173525));g.rotation.x=-Math.PI/2;g.receiveShadow=true;S.add(g);
let water=new THREE.Mesh(new THREE.CircleGeometry(13,48),mat(0x12465b,.02));water.rotation.x=-Math.PI/2;water.position.set(-14,.02,-16);water.scale.set(1.5,.7,1);S.add(water);
function addTree(x,z,s){let q=new THREE.Group(),t=new THREE.Mesh(new THREE.CylinderGeometry(.22*s,.35*s,2.5*s,8),mat(0x55331e)),c=new THREE.Mesh(new THREE.ConeGeometry(1.5*s,3.5*s,9),mat(0x0a3a25));t.position.y=1.25*s;c.position.y=3.1*s;q.add(t,c);q.position.set(x,0,z);q.traverse(o=>{if(o.isMesh)o.castShadow=true});S.add(q)}
for(let i=0;i<28;i++){let a=i*.91,d=20+(i%7)*4;addTree(Math.cos(a)*d,Math.sin(a)*d,.7+(i%4)*.16)}
function addRock(x,z,s){let q=new THREE.Mesh(new THREE.IcosahedronGeometry(s,1),mat(0x4b5660));q.position.set(x,s*.55,z);q.scale.y=.7;q.castShadow=true;S.add(q)}
for(let i=0;i<38;i++){let x=(i*19%76)-38,z=(i*37%76)-38;if(Math.hypot(x,z)>9)addRock(x,z,.5+(i%3)*.35)}
const P=new THREE.Group();P.position.set(0,0,5);let suit=new THREE.Mesh(new THREE.CapsuleGeometry(.45,.9,8,12),mat(0x246ec2));suit.position.y=1.25;let head=new THREE.Mesh(new THREE.SphereGeometry(.36,18,12),mat(0xc98d67));head.position.y=2.15;let visor=new THREE.Mesh(new THREE.BoxGeometry(.52,.14,.1),mat(0x4feaff,.04));visor.position.set(0,2.17,-.34);let pack=new THREE.Mesh(new THREE.BoxGeometry(.5,.7,.28),mat(0x182638));pack.position.set(0,1.35,.4);let blade=new THREE.Mesh(new THREE.BoxGeometry(.12,.12,1.15),mat(0xcbd7df));blade.position.set(.55,1.25,-.3);blade.rotation.z=-.35;P.add(suit,head,visor,pack,blade);P.traverse(o=>{if(o.isMesh)o.castShadow=true});S.add(P);
const crystals=[],enemies=[];
function crystal(x,z){let q=new THREE.Mesh(new THREE.OctahedronGeometry(.5),mat(0x35eaff,.12));q.position.set(x,.7,z);q.userData.phase=Math.random()*6;q.castShadow=true;S.add(q);crystals.push(q)}
for(let i=0;i<18;i++){let a=Math.random()*6.28,d=7+Math.random()*31;crystal(Math.cos(a)*d,Math.sin(a)*d)}
function enemy(x,z){let q=new THREE.Group(),b=new THREE.Mesh(new THREE.BoxGeometry(1.15,1.3,1.15),mat(0x9b2939,.015)),eye=new THREE.Mesh(new THREE.SphereGeometry(.21,12,8),mat(0xffa51f,.2));b.position.y=.75;eye.position.set(0,.85,-.61);q.add(b,eye);q.position.set(x,0,z);q.userData={hp:3,home:q.position.clone(),phase:Math.random()*6.28};q.traverse(o=>{if(o.isMesh)o.castShadow=true});S.add(q);enemies.push(q)}
for(let i=0;i<7;i++){let a=i*.88,d=12+(i%3)*7;enemy(Math.cos(a)*d,Math.sin(a)*d)}
let energy=0,hp=100,level=1,xp=0,cd=0,msgT=0;function message(t){document.getElementById('msg').textContent=t;document.getElementById('msg').style.opacity=1;msgT=1.4}
function attack(){if(cd)return;cd=.4;blade.rotation.z=-1.2;setTimeout(()=>blade.rotation.z=-.35,110);let b=null,d=3.4;for(let e of enemies)if(e.parent&&e.position.distanceTo(P.position)<d){b=e;d=e.position.distanceTo(P.position)}if(b){b.userData.hp--;message(b.userData.hp?'HIT':'SENTRY DOWN');if(b.userData.hp<=0){S.remove(b);energy+=3;xp+=35;if(xp>=level*100){xp-=level*100;level++;message('LEVEL UP')}}}}
document.getElementById('hit').onpointerdown=e=>{e.preventDefault();attack()};addEventListener('keydown',e=>{if(e.code==='Space')attack()});
let joy={x:0,y:0},J=document.getElementById('joy'),K=document.getElementById('knob'),joyActive=false,joyPointer=null;
function joyMove(e){const q=J.getBoundingClientRect(),x=e.clientX-(q.left+62),y=e.clientY-(q.top+62),len=Math.min(47,Math.hypot(x,y)),a=Math.atan2(y,x);joy.x=Math.cos(a)*len/47;joy.y=Math.sin(a)*len/47;K.style.left=(34+joy.x*28)+'px';K.style.top=(34+joy.y*28)+'px'}
J.onpointerdown=e=>{joyActive=true;joyPointer=e.pointerId;J.classList.add('active');joyMove(e);e.preventDefault()};
J.onpointermove=e=>{if(joyActive&&e.pointerId===joyPointer)joyMove(e);};
J.onpointerup=e=>{joyStop(e)};J.onpointercancel=e=>{joyStop(e)};
J.onpointerleave=e=>{if(joyActive&&e.pointerId===joyPointer)joyMove(e)};
let keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);document.querySelectorAll('#dpad button').forEach(b=>{const k=b.dataset.k;const on=e=>{e.preventDefault();keys[k]=1};const off=e=>{e.preventDefault();keys[k]=0};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)});let last=performance.now();function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;cd=Math.max(0,cd-dt);if(msgT>0&&(msgT-=dt)<=0)document.getElementById('msg').style.opacity=0;let x=(keys.d?1:0)-(keys.a?1:0)+(joyActive?joy.x:0),y=(keys.s?1:0)-(keys.w?1:0)+(joyActive?joy.y:0),l=Math.hypot(x,y)||1;x/=l;y/=l;if(x||y){P.position.x+=x*6*dt;P.position.z+=y*6*dt;P.position.x=Math.max(-48,Math.min(48,P.position.x));P.position.z=Math.max(-48,Math.min(48,P.position.z));P.rotation.y=Math.atan2(x,y)}for(let q of crystals){if(!q.parent)continue;q.rotation.y+=dt*1.8;q.position.y=.7+Math.sin(now*.002+q.userData.phase)*.15;if(q.position.distanceTo(P.position)<1.3){S.remove(q);energy++;xp+=10}}for(let e of enemies)if(e.parent){e.rotation.y+=dt;e.position.x=e.userData.home.x+Math.sin(now*.001+e.userData.phase)*1.8;e.position.z=e.userData.home.z+Math.cos(now*.0012+e.userData.phase)*1.6;if(e.position.distanceTo(P.position)<1.55)hp=Math.max(0,hp-17*dt)}if(hp<=0){hp=100;P.position.set(0,0,5);message('RECOVERED')}C.position.lerp(new THREE.Vector3(P.position.x,6.2,P.position.z+9),.1);C.lookAt(P.position.x,1.1,P.position.z);document.getElementById('energy').textContent=energy;document.getElementById('level').textContent=level;document.getElementById('fill').style.width=hp+'%';R.render(S,C);requestAnimationFrame(loop)}requestAnimationFrame(loop);addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
</script></body></html>
