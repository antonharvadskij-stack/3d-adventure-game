name: AION Agent Team

on:
  push:
    branches:
      - aion/long-run-agent-physics-regression
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aion-agent-team-${{ github.ref }}
  cancel-in-progress: true

jobs:
  physics-agent:
    name: Physics QA agent
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: aion-server/requirements.txt
      - name: Install isolated physics dependencies
        run: python -m pip install "numpy<2" "pybullet==3.2.7"
      - name: Deterministic physics regression
        working-directory: aion-server
        run: python qa_physics.py
      - name: 120-second isolated agent regression
        working-directory: aion-server
        run: python qa_physics_long_run.py

  browser-agent:
    name: Browser hydration and visual QA agent
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser QA dependencies
        working-directory: qa
        run: npm install
      - name: Install Chromium
        working-directory: qa
        run: npx playwright install --with-deps chromium
      - name: Run browser lifecycle and movement regression against isolated test service
        working-directory: qa
        env:
          AION_CLIENT_URL: https://aion-server-test.onrender.com/?server=https%3A%2F%2Faion-server-test.onrender.com
        run: npm test
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aion-agent-browser-report
          path: qa/artifacts/
          if-no-files-found: warn
          retention-days: 7

  diagnostic-agent:
    name: Evidence and hydration diagnostic agent
    runs-on: ubuntu-latest
    needs: [browser-agent]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aion-agent-browser-report
          path: artifacts
        continue-on-error: true
      - name: Inspect lifecycle evidence
        id: inspect
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("artifacts/aion-lifecycle-report.json")
          if not p.exists():
              print("::warning::No lifecycle report was uploaded; browser-agent logs are required for diagnosis.")
              pathlib.Path("diagnostic-result.txt").write_text("INCOMPLETE: lifecycle report missing\n")
              sys.exit(0)
          report = json.loads(p.read_text(encoding="utf-8"))
          checks = report.get("checks", {})
          print(json.dumps({"ok": report.get("ok"), "checks": checks, "hydration": report.get("hydration")}, indent=2, ensure_ascii=False))
          failed = [name for name in ("server_hydration", "no_browser_errors", "no_destructive_mutation_attempts", "world_state_monotonic") if checks.get(name) is not True]
          if report.get("ok") is not True or failed:
              pathlib.Path("diagnostic-result.txt").write_text("FAIL: " + ", ".join(failed or ["report.ok"]) + "\n")
              sys.exit(1)
          pathlib.Path("diagnostic-result.txt").write_text("PASS: hydration, browser errors, mutation safety, world monotonicity\n")
          PY
      - name: Publish diagnostic result
        if: always()
        run: |
          if test -f diagnostic-result.txt; then cat diagnostic-result.txt >> "$GITHUB_STEP_SUMMARY"; else echo "Diagnostic report unavailable" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload diagnostic summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aion-agent-diagnostic
          path: diagnostic-result.txt
          if-no-files-found: warn
          retention-days: 7

  reviewer-agent:
    name: Independent safety and test review agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify test-target and mutation guards
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          failures = []
          smoke = Path("qa/browser_smoke.mjs").read_text(encoding="utf-8")
          physics = Path("qa/browser_physics_regression.mjs").read_text(encoding="utf-8")
          if "aion-server-test.onrender.com" not in Path(".github/workflows/aion-agent-team.yml").read_text(encoding="utf-8"):
              failures.append("agent workflow must target the isolated test service")
          for name, source in (("browser_smoke.mjs", smoke), ("browser_physics_regression.mjs", physics)):
              if '["GET", "HEAD", "OPTIONS"]' not in source:
                  failures.append(f"{name}: missing read-only HTTP method allowlist")
              if "route.abort" not in source or "blockedMutations" not in source:
                  failures.append(f"{name}: mutation requests are not explicitly blocked and recorded")
          workflow = Path(".github/workflows/aion-agent-team.yml").read_text(encoding="utf-8")
          if "AION_CLIENT_URL: https://aion-server-test.onrender.com/" not in workflow:
              failures.append("browser tests must explicitly use the isolated test service")
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("PASS: isolated test target and browser mutation guards verified")
          PY

  coordinator:
    name: Coordinator agent summary
    runs-on: ubuntu-latest
    if: always()
    needs: [physics-agent, browser-agent, diagnostic-agent, reviewer-agent]
    steps:
      - name: Summarize specialist outcomes
        env:
          PHYSICS: ${{ needs.physics-agent.result }}
          BROWSER: ${{ needs.browser-agent.result }}
          DIAGNOSTIC: ${{ needs.diagnostic-agent.result }}
          REVIEWER: ${{ needs.reviewer-agent.result }}
        run: |
          {
            echo "# AION Agent Team"
            echo ""
            echo "| Specialist | Result |"
            echo "|---|---|"
            echo "| Physics QA | $PHYSICS |"
            echo "| Browser QA | $BROWSER |"
            echo "| Diagnostics | $DIAGNOSTIC |"
            echo "| Safety review | $REVIEWER |"
            echo ""
            echo "Safety: this workflow only targets the isolated test service and isolated physics simulation. It does not deploy, mutate PostgreSQL, run BIG_BANG, or merge PR #6."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$PHYSICS" != "success" ] || [ "$BROWSER" != "success" ] || [ "$DIAGNOSTIC" != "success" ] || [ "$REVIEWER" != "success" ]; then
            echo "One or more AION agent checks failed or were incomplete."
            exit 1
          fi
