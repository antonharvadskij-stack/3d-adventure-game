name: AION Visual QA

on:
  workflow_dispatch:
  push:
    branches: ["**"]

concurrency:
  group: aion-visual-qa
  cancel-in-progress: false

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser QA
        working-directory: qa
        run: npm install && npx playwright install --with-deps chromium
      - name: Wait for the matching frontend and physics deployment
        env:
          AION_CLIENT_URL: https://aion-server-test.onrender.com
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base = os.environ["AION_CLIENT_URL"].rstrip("/")
          for attempt in range(18):
              try:
                  with urllib.request.urlopen(base + "/", timeout=15) as response:
                      html = response.read().decode("utf-8")
                  with urllib.request.urlopen(base + "/world", timeout=15) as response:
                      world = json.load(response)
                  physics = world.get("physics", {})
                  has_goals = any(isinstance(a.get("goalPosition"), dict) for a in world.get("population", []))
                  if "Жители мира: " in html and physics.get("terrainCollider") is True and has_goals:
                      print("Current HUD, terrain collision and autonomous movement are live")
                      raise SystemExit(0)
              except Exception as exc:
                  print(f"Readiness attempt {attempt + 1}/18: {exc}")
              print(f"Waiting for the latest AION deployment ({attempt + 1}/18)")
              time.sleep(10)
          raise SystemExit("Timed out waiting for the expected AION frontend/physics build")
          PY
      - name: Run AION visual smoke test
        working-directory: qa
        env:
          AION_CLIENT_URL: https://aion-server-test.onrender.com
        run: npm test
      - name: Publish lifecycle report even on failure
        if: always()
        run: cat qa/artifacts/aion-lifecycle-report.json || true
      - name: Upload AION screenshot and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aion-visual-qa
          path: qa/artifacts/

# force new workflow run
