name: AION Visual QA

on:
  workflow_dispatch:
  push:
    branches: ["**"]

concurrency:
  group: aion-visual-qa
  cancel-in-progress: false

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser QA
        working-directory: qa
        run: npm install && npx playwright install --with-deps chromium
      - name: Wait for the matching frontend deployment
        env:
          AION_CLIENT_URL: https://aion-server-test.onrender.com
        run: |
          for attempt in $(seq 1 18); do
            if curl -fsS "$AION_CLIENT_URL/" | grep -q 'Жители мира: '; then
              echo "AION frontend with the HUD population/log fixes is live"
              exit 0
            fi
            echo "Frontend deployment not visible yet (attempt $attempt/18); waiting 10 seconds"
            sleep 10
          done
          echo "Timed out waiting for the expected AION frontend build" >&2
          exit 1
      - name: Run AION visual smoke test
        working-directory: qa
        env:
          AION_CLIENT_URL: https://aion-server-test.onrender.com
        run: npm test
      - name: Publish lifecycle report even on failure
        if: always()
        run: cat qa/artifacts/aion-lifecycle-report.json || true
      - name: Upload AION screenshot and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aion-visual-qa
          path: qa/artifacts/

# force new workflow run
