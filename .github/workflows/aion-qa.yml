name: AION QA

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  physics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aion-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run deterministic physics QA
        run: python qa_physics.py
