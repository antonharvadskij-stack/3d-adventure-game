name: AION QA

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      confirm_live_persistence_test:
        description: "Explicitly allow the live persistence endpoint to advance the production world by 5 simulated seconds"
        required: true
        type: boolean
        default: false

concurrency:
  group: aion-live-qa
  cancel-in-progress: false

jobs:
  physics:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: aion-server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: aion-server/requirements.txt
      - name: Install test dependencies
        run: python -m pip install "numpy<2" "pybullet==3.2.7"
      - name: Run deterministic physics QA
        run: python qa_physics.py
      - name: Run 120-second isolated agent physics regression
        run: python qa_physics_long_run.py

      # This endpoint advances the live PostgreSQL-backed world; never run it automatically.
      - name: Live persistence API check
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_live_persistence_test == true }}
        env:
          AION_SERVER_URL: https://aion-server-b80c.onrender.com
        run: |
          python - <<'PY'
          import json, os, urllib.request
          base=os.environ["AION_SERVER_URL"]
          import time
          def get(path, attempts=6):
              last=None
              for i in range(attempts):
                  try:
                      with urllib.request.urlopen(base+path, timeout=30) as r:
                          return json.load(r)
                  except Exception as e:
                      last=e
                      time.sleep(min(15, 2**i))
              raise last
          before=get("/debug/world")
          test_url=base+"/debug/persistence-test?seconds=5"
          req=urllib.request.Request(test_url, method="POST")
          last=None
          for attempt in range(5):
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      result=json.load(r)
                  break
              except Exception as e:
                  last=e
                  time.sleep(min(15, 3*(attempt+1)))
          else:
              raise last
          after=get("/debug/world")
          print(json.dumps({"before":before,"persistence_test":result,"after":after}, ensure_ascii=False, indent=2))
          assert result.get("ok") is True, "persistence-test failed"
          assert after.get("worldVersion", 0) >= result["after"]["worldVersion"], "live world version did not persist"
          PY
