name: AION QA

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  physics:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: aion-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: aion-server/requirements.txt
      - name: Install PyBullet
        run: pip install pybullet==3.2.7
      - name: Run deterministic physics QA
        run: python qa_physics.py
