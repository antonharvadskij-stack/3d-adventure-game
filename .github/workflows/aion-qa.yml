name: AION QA

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  physics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aion-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aion-server/requirements.txt
      - name: Install physics dependency only
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: pybullet==3.2.7
      - name: Run deterministic physics QA
        run: python qa_physics.py
