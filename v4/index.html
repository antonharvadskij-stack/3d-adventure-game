<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Frontier Echo V17</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071321;font-family:Arial;color:#fff}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none}#ver{position:fixed;right:12px;top:12px;padding:7px 10px;border-radius:9px;background:#5eeaff;color:#061018;font-weight:900}#joy{pointer-events:auto;position:fixed;left:22px;bottom:22px;width:130px;height:130px;border:2px solid #ffffff55;border-radius:50%;background:#071321aa;opacity:0;transition:opacity .12s;touch-action:none}#joy.active{opacity:1}#knob{position:absolute;left:36px;top:36px;width:54px;height:54px;border-radius:50%;background:#5eeaffbb}#attack{pointer-events:auto;position:fixed;right:24px;bottom:30px;width:88px;height:88px;border-radius:50%;border:2px solid #fff5;background:#c73b45;color:#fff;font-weight:900}#hud{position:fixed;left:12px;top:12px;padding:10px 13px;background:#07101ddd;border-radius:12px;font-weight:800}#bar{width:170px;height:7px;background:#26313a;border-radius:5px;margin-top:6px}#hp{height:100%;width:100%;background:#45e39b;border-radius:5px}.enemybar{position:absolute;width:70px;height:6px;background:#171b22;border-radius:4px;transform:translate(-50%,-50%);pointer-events:none}.enemybar i{display:block;height:100%;background:#ff4154;border-radius:4px}#inv{position:fixed;right:12px;top:62px;padding:8px 11px;background:#07101ddd;border-radius:10px;font-weight:800}.toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);padding:10px 16px;border-radius:12px;background:#07101ddd;font-weight:900;opacity:0;transition:.2s;pointer-events:none}#invBtn{position:fixed;left:22px;top:92px;z-index:2147483647;width:54px;height:54px;border:2px solid #5eeaff;border-radius:14px;background:#071321dd;color:#fff;font-size:26px}#invPanel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3000;width:min(86vw,420px);padding:20px;background:#071321f5;border:2px solid #5eeaff;border-radius:18px;color:#fff;display:none;font-family:Arial}#invPanel.show{display:block}#invPanel h2{margin:0 0 15px}#invClose{position:absolute;right:10px;top:6px;background:none;border:0;color:#fff;font-size:28px}#invSlots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.invSlot{min-height:70px;border:1px solid #ffffff33;border-radius:10px;padding:9px;background:#ffffff0b;font-weight:700}</style></head><body><div id="ui"><div id="hud">ENERGY <b id="energy">0</b> · LV <b id="level">1</b><div id="bar"><div id="hp"></div></div></div><div id="ver">FRONTIER ECHO V59</div><div id="toast" class="toast"></div><div id="joy"><div id="knob"></div></div><button id="attack">⚔</button></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x071321);scene.fog=new THREE.Fog(0x071321,25,80);const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,150);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0x9bd7ff,0x172817,2.2));const moon=new THREE.PointLight(0x48cfff,7,28);moon.position.set(0,7,2);scene.add(moon);const sun=new THREE.DirectionalLight(0xffdfad,2.8);sun.position.set(-15,25,12);sun.castShadow=true;scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(120,120),new THREE.MeshStandardMaterial({color:0x183b2b,roughness:.9}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);function rock(x,z,s=1){const r=new THREE.Mesh(new THREE.DodecahedronGeometry(s,1),new THREE.MeshStandardMaterial({color:0x46515b,roughness:.92,metalness:.08}));r.position.set(x,s*.45,z);r.scale.y=.65;r.rotation.y=Math.random()*6.28;r.castShadow=true;r.receiveShadow=true;scene.add(r)}
function bush(x,z,s=1){const g=new THREE.Group(),m=new THREE.MeshStandardMaterial({color:0x1d673e,roughness:.95});for(let i=0;i<4;i++){const q=new THREE.Mesh(new THREE.IcosahedronGeometry(.7*s,1),m);q.position.set((Math.random()-.5)*s,.55*s,(Math.random()-.5)*s);g.add(q)}g.position.set(x,0,z);g.traverse(o=>{if(o.isMesh)o.castShadow=true});scene.add(g)}
function ruin(x,z){const m=new THREE.MeshStandardMaterial({color:0x59616a,roughness:.86});const g=new THREE.Group();for(let i=0;i<4;i++){const w=new THREE.Mesh(new THREE.BoxGeometry(.8,2.8,1.1),m);w.position.set((i%2)*2.2-1.1,1.4,Math.floor(i/2)*2.2-1.1);w.rotation.y=(i%2)*.15;g.add(w)}g.position.set(x,0,z);g.rotation.y=.3;g.traverse(o=>{if(o.isMesh)o.castShadow=true});scene.add(g)}
const colliders=[];function addCollider(x,z,r){colliders.push({x,z,r})}
function tree(x,z){const g=new THREE.Group(),t=new THREE.Mesh(new THREE.CylinderGeometry(.3,.48,3.2,10),new THREE.MeshStandardMaterial({color:0x4b3020,roughness:.95})),c=new THREE.Mesh(new THREE.ConeGeometry(1.7,4.2,10),new THREE.MeshStandardMaterial({color:0x155536,roughness:.9}));t.position.y=1.2;c.position.y=3;g.add(t,c);g.position.set(x,0,z);g.traverse(o=>{if(o.isMesh)o.castShadow=true});scene.add(g)}for(let i=0;i<30;i++){const a=i*.93,d=18+i%6*4,x=Math.cos(a)*d,z=Math.sin(a)*d;tree(x,z);addCollider(x,z,1.15)}for(let i=0;i<38;i++){const a=i*2.41,d=6+(i%9)*3,x=Math.cos(a)*d,z=Math.sin(a)*d,s=.35+(i%3)*.22;rock(x,z,s);addCollider(x,z,.75+s)}for(let i=0;i<28;i++){const a=i*1.71,d=7+(i%7)*4,x=Math.cos(a)*d,z=Math.sin(a)*d,s=.7+(i%2)*.3;bush(x,z,s);addCollider(x,z,1.05*s)}ruin(-10,-13);ruin(14,9);addCollider(-10,-13,3);addCollider(14,9,3);const player=new THREE.Group();player.position.set(0,0,5);
const suit=new THREE.MeshStandardMaterial({color:0x263b57,metalness:.65,roughness:.28}), armor=new THREE.MeshStandardMaterial({color:0x4c7da8,metalness:.72,roughness:.22}), glow=new THREE.MeshStandardMaterial({color:0x49e8ff,emissive:0x147c92,emissiveIntensity:2});
const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.43,.78,8,14),suit);torso.position.y=1.18;
const chest=new THREE.Mesh(new THREE.BoxGeometry(.68,.5,.28),armor);chest.position.set(0,1.35,-.18);
const head=new THREE.Mesh(new THREE.SphereGeometry(.34,20,16),suit);head.position.y=2.05;
const visor=new THREE.Mesh(new THREE.BoxGeometry(.52,.13,.08),glow);visor.position.set(0,2.08,-.31);
const backpack=new THREE.Mesh(new THREE.BoxGeometry(.42,.58,.2),suit);backpack.position.set(0,1.35,.28);
const armL=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.55,6,10),armor),armR=armL.clone();armL.position.set(-.5,1.32,0);armR.position.set(.5,1.32,0);
const legL=new THREE.Mesh(new THREE.CapsuleGeometry(.14,.62,6,10),suit),legR=legL.clone();legL.position.set(-.2,.55,0);legR.position.set(.2,.55,0);
const weapon=new THREE.Mesh(new THREE.BoxGeometry(.12,.75,.12),armor);weapon.position.set(.52,1.02,-.22);weapon.rotation.x=-.35;
player.add(torso,chest,head,visor,backpack,armL,armR,legL,legR,weapon);player.userData.parts={armL,armR,legL,legR,weapon};player.traverse(o=>{if(o.isMesh)o.castShadow=true});scene.add(player);const crystals=[];for(let i=0;i<18;i++){const a=Math.random()*6.28,d=8+Math.random()*32,q=new THREE.Mesh(new THREE.OctahedronGeometry(.48),new THREE.MeshStandardMaterial({color:0x35eaff,emissive:0x0b3540}));q.position.set(Math.cos(a)*d,.7,Math.sin(a)*d);scene.add(q);crystals.push(q)}function enemyModel(){const g=new THREE.Group(),m=new THREE.MeshStandardMaterial({color:0x7b2330,metalness:.55,roughness:.32}),dark=new THREE.MeshStandardMaterial({color:0x171b27,metalness:.7}),e=new THREE.MeshStandardMaterial({color:0xff4154,emissive:0x7d101c,emissiveIntensity:2});const b=new THREE.Mesh(new THREE.CapsuleGeometry(.45,.65,8,12),m);b.position.y=.95;const h=new THREE.Mesh(new THREE.SphereGeometry(.32,16,12),dark);h.position.y=1.65;const eye=new THREE.Mesh(new THREE.BoxGeometry(.34,.09,.08),e);eye.position.set(0,1.68,-.29);const arm1=new THREE.Mesh(new THREE.CapsuleGeometry(.1,.55,6,8),m),arm2=arm1.clone();arm1.position.set(-.48,1.05,0);arm2.position.set(.48,1.05,0);g.add(b,h,eye,arm1,arm2);g.traverse(o=>{if(o.isMesh)o.castShadow=true});return g}const enemies=[];for(let i=0;i<6;i++){const q=enemyModel();q.position.set(Math.cos(i)*(12+i*3),0,Math.sin(i)*(12+i*3));q.userData.home=q.position.clone();q.userData.hp=3;q.userData.maxHp=3;q.userData.hit=0;scene.add(q);enemies.push(q)}
let joy={x:0,y:0},active=false,id=null,J=document.getElementById('joy'),K=document.getElementById('knob');function point(x,y){const r=J.getBoundingClientRect(),dx=x-(r.left+r.width/2),dy=y-(r.top+r.height/2),len=Math.min(48,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);joy.x=Math.cos(a)*len/48;joy.y=Math.sin(a)*len/48;K.style.left=36+joy.x*28+'px';K.style.top=36+joy.y*28+'px'}function stop(){active=false;id=null;joy={x:0,y:0};J.classList.remove('active');K.style.left='36px';K.style.top='36px'}J.addEventListener('touchstart',e=>{const t=e.changedTouches[0];active=true;id=t.identifier;J.classList.add('active');point(t.clientX,t.clientY);e.preventDefault()},{passive:false});document.addEventListener('touchmove',e=>{if(!active)return;for(const t of e.changedTouches)if(t.identifier===id){point(t.clientX,t.clientY);e.preventDefault()}},{passive:false});document.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===id){stop();e.preventDefault()}},{passive:false});document.addEventListener('touchcancel',stop,{passive:false});function blocked(nx,nz){const r=.62;for(const c of colliders){if(Math.hypot(nx-c.x,nz-c.z)<c.r+r)return true}for(const e of enemies)if(e.parent&&Math.hypot(nx-e.position.x,nz-e.position.z)<1.25)return true;return false}
let energy=0,level=1,hp=100,last=performance.now();const enemyBars=[];function addEnemyBar(e){const b=document.createElement('div');b.className='enemybar';b.innerHTML='<i></i>';document.getElementById('ui').appendChild(b);enemyBars.push({e,b})}function removeEnemyBar(e){const k=enemyBars.findIndex(v=>v.e===e);if(k>=0){enemyBars[k].b.remove();enemyBars.splice(k,1)}}const effects=[];const bars=new Map();const toast=document.getElementById('toast');let toastTimer=0;function showToast(t){toast.textContent=t;toast.style.opacity=1;toastTimer=1.4}function hitFx(p){const g=new THREE.Group();for(let i=0;i<8;i++){const q=new THREE.Mesh(new THREE.SphereGeometry(.07,6,6),new THREE.MeshBasicMaterial({color:0xffd35a}));const a=i*Math.PI/4;q.position.set(Math.cos(a)*.2,.9+Math.sin(a)*.2,Math.sin(a)*.2);q.userData.v=new THREE.Vector3(Math.cos(a)*2,(i%3)*.7,Math.sin(a)*2);g.add(q)}g.position.copy(p);scene.add(g);effects.push({g,t:0})}function gainXP(n){energy+=n;if(energy>=10){energy-=10;level++}}function attack(){let best=null,d=3.2;for(const e of enemies)if(e.parent){const z=e.position.distanceTo(player.position);if(z<d){d=z;best=e}}if(best){best.userData.hp--;best.userData.hit=.18;hitFx(best.position);if(best.userData.hp<=0){const p=best.position.clone();scene.remove(best);removeEnemyBar(best);gainXP(3);showToast('Враг уничтожен +3 XP');for(let i=0;i<2;i++){const c=new THREE.Mesh(new THREE.OctahedronGeometry(.22),new THREE.MeshStandardMaterial({color:0xffd35a,emissive:0x6b4300}));c.position.copy(p);c.position.x+=(Math.random()-.5)*1.2;c.position.z+=(Math.random()-.5)*1.2;scene.add(c)}}}}document.getElementById('attack').addEventListener('touchstart',e=>{e.preventDefault();attack()},{passive:false});function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;const x=joy.x,y=joy.y;if(Math.hypot(x,y)>.08){const speed=6*dt,ca=window.cameraYaw||0,mx=x*Math.cos(ca)+y*Math.sin(ca),mz=-x*Math.sin(ca)+y*Math.cos(ca),nx=player.position.x+mx*speed,nz=player.position.z+mz*speed;if(!blocked(nx,player.position.z))player.position.x=nx;if(!blocked(player.position.x,nz))player.position.z=nz;player.rotation.y=Math.atan2(mx,mz);const p=player.userData.parts,step=Math.sin(now*.018)*.28;p.legL.rotation.x=step;p.legR.rotation.x=-step;p.armL.rotation.x=-step*.7;p.armR.rotation.x=step*.7}else{const p=player.userData.parts;p.legL.rotation.x*=.82;p.legR.rotation.x*=.82;p.armL.rotation.x*=.82;p.armR.rotation.x*=.82}for(const q of crystals)if(q.parent){q.rotation.y+=dt*2;q.position.y=.7+Math.sin(now*.002+q.id)*.12;if(q.position.distanceTo(player.position)<1.2){scene.remove(q);energy++}}for(const e of enemies)if(e.parent){if(!enemyBars.some(v=>v.e===e))addEnemyBar(e);e.rotation.y+=dt;e.userData.hit=Math.max(0,e.userData.hit-dt);e.scale.setScalar(e.userData.hit>0?1.12:1);const d=e.position.distanceTo(player.position);if(d<9){const dx=player.position.x-e.position.x,dz=player.position.z-e.position.z,l=Math.max(d,.001);e.position.x+=dx/l*dt*1.2;e.position.z+=dz/l*dt*1.2}else{e.position.x=e.userData.home.x+Math.sin(now*.001+e.id)*1.4;e.position.z=e.userData.home.z+Math.cos(now*.0012+e.id)*1.4}if(d<1.5)hp=Math.max(0,hp-12*dt)}for(const z of effects){z.t+=dt;z.g.children.forEach(q=>{q.position.addScaledVector(q.userData.v,dt);q.scale.multiplyScalar(.96)});if(z.t>.35){scene.remove(z.g);effects.splice(effects.indexOf(z),1)}}const cd=9,cx=Math.sin(window.cameraYaw||0)*cd,cz=Math.cos(window.cameraYaw||0)*cd,cy=3.5+(window.cameraPitch||.55)*4;camera.position.lerp(new THREE.Vector3(player.position.x+cx,cy,player.position.z+cz),.12);camera.lookAt(player.position.x,1.1,player.position.z);document.getElementById('energy').textContent=energy;document.getElementById('level').textContent=level;toastTimer-=dt;if(toastTimer<=0)toast.style.opacity=0;for(const v of enemyBars){if(v.e.parent){const p=v.e.position.clone();p.y=2.5;p.project(camera);const visible=p.z<1&&Math.abs(p.x)<1.2&&Math.abs(p.y)<1.2;v.b.style.left=((p.x*.5+.5)*innerWidth)+'px';v.b.style.top=((-p.y*.5+.5)*innerHeight)+'px';v.b.style.display=visible?'block':'none';v.b.querySelector('i').style.width=(v.e.userData.hp/v.e.userData.maxHp*100)+'%'}}document.getElementById('hp').style.width=hp+'%';renderer.render(scene,camera);requestAnimationFrame(loop)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script><div id="cameraStick" style="position:fixed;right:24px;bottom:150px;width:110px;height:110px;border-radius:55px;background:rgba(0,80,110,.95);border:4px solid #5eeaff;z-index:2147483647;display:flex;align-items:center;justify-content:center;box-sizing:border-box;touch-action:none;"><div style="width:46px;height:46px;border-radius:23px;background:#5eeaff;"></div></div><script>(function(){const s=document.getElementById('cameraStick'),k=s.firstElementChild;let id=null,lastX=0,lastY=0;window.cameraYaw=0;window.cameraPitch=.55;function mv(t){const r=s.getBoundingClientRect(),dx=t.clientX-r.left-r.width/2,dy=t.clientY-r.top-r.height/2,m=Math.min(28,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);k.style.transform='translate('+Math.cos(a)*m+'px,'+Math.sin(a)*m+'px)';window.cameraYaw-=(t.clientX-lastX)*.012;window.cameraPitch=Math.max(.25,Math.min(1.05,window.cameraPitch-(t.clientY-lastY)*.008));lastX=t.clientX;lastY=t.clientY}function reset(){id=null;k.style.transform=''}s.addEventListener('touchstart',e=>{const t=e.changedTouches[0];id=t.identifier;lastX=t.clientX;lastY=t.clientY;e.preventDefault()},{passive:false});document.addEventListener('touchmove',e=>{if(id===null)return;for(const t of e.changedTouches)if(t.identifier===id){mv(t);e.preventDefault()}},{passive:false});document.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===id)reset()});document.addEventListener('touchcancel',reset)})();</script><button id="invBtn" aria-label="Инвентарь" onclick="document.getElementById('invPanel').style.display='block'" ontouchend="event.preventDefault();document.getElementById('invPanel').style.display='block'">🎒</button><div id="invPanel"><button id="invClose" style="position:absolute;right:10px;top:6px;background:#102536;border:2px solid #5eeaff;color:#fff;border-radius:10px;width:42px;height:42px;font-size:26px;z-index:5" onclick="document.getElementById('invPanel').style.display='none'">×</button><h2>🎒 Инвентарь</h2><div id="invSlots"><div class="invSlot">✦<br>Осколки<br><span id="invCount">0</span></div><button class="invSlot" style="color:#fff;text-align:center;font:inherit" onclick="alert('Меч выбран')">⚔️<br>Оружие<br>Меч</button><button class="invSlot" style="color:#fff;text-align:center;font:inherit" onclick="alert('Слот брони выбран')">🛡️<br>Броня<br>Пусто</button></div></div><script>(function(){document.addEventListener('click',function(e){if(e.target.closest('#invBtn')){const p=document.getElementById('invPanel'),n=document.getElementById('invCount');if(n)n.textContent=typeof shards==='number'?shards:0;if(p)p.classList.add('show')}if(e.target.closest('#invClose')){const p=document.getElementById('invPanel');if(p)p.classList.remove('show')}});document.addEventListener('touchend',function(e){if(e.target.closest('#invBtn')){e.preventDefault();const p=document.getElementById('invPanel'),n=document.getElementById('invCount');if(n)n.textContent=typeof shards==='number'?shards:0;if(p)p.classList.add('show')}},{passive:false})})();</script></body></html>
