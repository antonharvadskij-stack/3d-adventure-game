<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>AION — Живая Вселенная</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none}#top{position:absolute;left:16px;top:16px;background:#05070ddd;border:1px solid #ffffff22;border-radius:16px;padding:14px 16px;min-width:260px}#top b{font-size:20px}#log{position:absolute;left:16px;bottom:16px;width:min(90vw,430px);max-height:180px;overflow:hidden;background:#05070dcc;border:1px solid #ffffff18;border-radius:14px;padding:10px;font-size:12px}#birth{position:absolute;right:16px;top:16px;background:#05070ddd;border:1px solid #ffffff22;border-radius:16px;padding:14px;max-width:270px} .event{margin:4px 0;color:#b8c7d9}</style></head><body><div id="ui"><div id="top"><b>🤖 AION</b><div id="state">Создание вселенной…</div></div><div id="birth"><b>ЭВОЛЮЦИЯ</b><div id="epoch">Большой взрыв</div></div><div id="log"></div></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x02030a);scene.fog=new THREE.Fog(0x02030a,35,90);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,200);camera.position.set(0,18,25);camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x88aaff,0x111111,1.5));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(10,20,10);scene.add(sun);
const world=new THREE.Group();scene.add(world);
const ground=new THREE.Mesh(new THREE.CylinderGeometry(25,28,1,64),new THREE.MeshStandardMaterial({color:0x14291e,roughness:1}));ground.position.y=-.5;world.add(ground);
const agents=[], settlements=[], memories=[];let age=0,cycle=0,phase=0,epoch='Большой взрыв',last=performance.now(),acc=0;
function log(t){memories.unshift(t);if(memories.length>9)memories.pop();document.getElementById('log').innerHTML=memories.map(x=>'<div class="event">• '+x+'</div>').join('')}
function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.85})}
function makeAgent(i){const g=new THREE.Group(),body=new THREE.Mesh(new THREE.CapsuleGeometry(.35,.65,6,10),mat(0x4b7d68)),head=new THREE.Mesh(new THREE.SphereGeometry(.27,12,10),mat(0x86b69c));body.position.y=.65;head.position.y=1.35;g.add(body,head);let a=Math.random()*6.28,d=3+Math.random()*15;g.position.set(Math.cos(a)*d,0,Math.sin(a)*d);world.add(g);const x={g,name:['Ари','Нова','Тар','Лум','Кай','Сел','Ори','Вен'][i%8]+' '+(i+1),food:100,energy:100,goal:null,home:g.position.clone(),age:0};agents.push(x);return x}
function build(a){if(settlements.length>=6)return;const g=new THREE.Group();const base=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.8,.8,8),mat(0x806044));const roof=new THREE.Mesh(new THREE.ConeGeometry(1.8,1.4,6),mat(0x394d59));base.position.y=.4;roof.position.y=1.5;g.add(base,roof);g.position.copy(a.g.position);world.add(g);settlements.push(g);a.home=g.position.clone();log(a.name+' построил первое поселение');}
function think(dt){age+=dt;for(const a of agents){a.age+=dt;a.food-=dt*.7;a.energy-=dt*.35;if(!a.goal||a.g.position.distanceTo(a.goal)<1){const ang=Math.random()*6.28,d=4+Math.random()*9;a.goal=a.home.clone();a.goal.x+=Math.cos(ang)*d;a.goal.z+=Math.sin(ang)*d}if(a.food<35){a.goal=new THREE.Vector3((Math.random()-.5)*20,0,(Math.random()-.5)*20)}const dx=a.goal.x-a.g.position.x,dz=a.goal.z-a.g.position.z,l=Math.hypot(dx,dz)||1;a.g.position.x+=dx/l*dt*1.2;a.g.position.z+=dz/l*dt*1.2;a.g.rotation.y=Math.atan2(dx,dz);if(a.energy<20){a.goal=a.home;a.energy=85}if(a.age>18&&Math.random()<dt*.006)build(a)}
acc+=dt;if(acc>2){acc=0;cycle++;if(agents.length<3)makeAgent(agents.length);else if(agents.length<12&&Math.random()<.55)makeAgent(agents.length);if(cycle%4===0)log(agents[Math.floor(Math.random()*agents.length)].name+' самостоятельно исследует мир');if(cycle%7===0)log('AION анализирует последствия решений жителей');const civ=agents.length*.8+settlements.length*4;if(civ>18)epoch='Зарождение цивилизации';else if(civ>9)epoch='Развитие жизни';else if(civ>3)epoch='Пробуждение';document.getElementById('epoch').textContent=epoch}}
function animate(){requestAnimationFrame(animate);const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;think(dt);world.rotation.y+=dt*.015;document.getElementById('state').innerHTML='Возраст: '+age.toFixed(0)+' с<br>Цикл: '+cycle+'<br>Жителей: '+agents.length+'<br>Поселений: '+settlements.length+'<br>Память: '+memories.length+' событий';camera.lookAt(0,0,0);renderer.render(scene,camera)}log('Большой взрыв. Пространство начало расширяться.');setTimeout(()=>{epoch='Формирование мира';document.getElementById('epoch').textContent=epoch;log('Формируется первая планета');},1800);setTimeout(()=>log('AION получает контроль над симуляцией'),3500);animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
