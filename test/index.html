<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Frontier Echo — Test</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#08111d;font-family:Arial;color:white}canvas{display:block}#hud{position:fixed;top:14px;left:14px;padding:12px 16px;background:#06101bcc;border:1px solid #ffffff22;border-radius:12px;font-size:16px;z-index:3}#hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#06101bcc;padding:10px 14px;border-radius:10px;z-index:3;font-size:13px}#joy{position:fixed;left:24px;bottom:35px;width:110px;height:110px;border:2px solid #ffffff55;border-radius:50%;z-index:4}#knob{position:absolute;width:48px;height:48px;left:29px;top:29px;border-radius:50%;background:#55dfff99}#atk{position:fixed;right:28px;bottom:42px;width:82px;height:82px;border-radius:50%;border:0;background:#ff5c5c;color:white;font-weight:bold;z-index:4}</style></head><body><div id="hud">ENERGY <b id="e">0</b> · HP <b id="h">100</b> · LV <b id="l">1</b></div><div id="joy"><div id="knob"></div></div><button id="atk">ATTACK</button><div id="hint">Собирай кристаллы и побеждай дронов</div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';const s=new THREE.Scene();s.background=new THREE.Color(0x08111d);const c=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,200);const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,1.7));r.setSize(innerWidth,innerHeight);document.body.appendChild(r.domElement);s.add(new THREE.HemisphereLight(0x9bc7ff,0x17251b,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-10,20,8);s.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshStandardMaterial({color:0x244532,roughness:.95}));ground.rotation.x=-Math.PI/2;s.add(ground);for(let i=0;i<55;i++){const m=new THREE.Mesh(new THREE.DodecahedronGeometry(.6+Math.random()*1.1),new THREE.MeshStandardMaterial({color:0x34404a}));m.position.set((Math.random()-.5)*70,.5,(Math.random()-.5)*70);m.scale.y=1+Math.random()*2;s.add(m)}const p=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.85,6,10),new THREE.MeshStandardMaterial({color:0x2675c8,metalness:.2,roughness:.55}));body.position.y=1;p.add(body);const core=new THREE.Mesh(new THREE.SphereGeometry(.13,12,12),new THREE.MeshBasicMaterial({color:0x5ce8ff}));core.position.set(0,1.1,-.4);p.add(core);p.position.set(0,0,4);s.add(p);const crystals=[];for(let i=0;i<18;i++){const g=new THREE.Mesh(new THREE.OctahedronGeometry(.45),new THREE.MeshStandardMaterial({color:0x35dfff,emissive:0x0b6680,emissiveIntensity:2}));g.position.set((Math.random()-.5)*55,.65,(Math.random()-.5)*55);s.add(g);crystals.push(g)}const enemies=[];for(let i=0;i<7;i++){const g=new THREE.Mesh(new THREE.BoxGeometry(1.15,1.15,1.15),new THREE.MeshStandardMaterial({color:0xb82e3b,emissive:0x250000}));g.position.set((Math.random()-.5)*45,.6,(Math.random()-.5)*45);g.userData.hp=3;g.userData.home=g.position.clone();s.add(g);enemies.push(g)}let energy=0,hp=100,lv=1,xp=0;const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.code==='Space')attack()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);function attack(){let best=null,d=3;for(const e of enemies){const q=e.position.distanceTo(p.position);if(q<d){d=q;best=e}}if(best){best.userData.hp--;if(best.userData.hp<=0){s.remove(best);enemies.splice(enemies.indexOf(best),1);energy+=2;xp+=30;if(xp>=lv*100){xp-=lv*100;lv++}}}}document.getElementById('atk').ontouchstart=e=>{e.preventDefault();attack()};document.getElementById('atk').onclick=attack;let joy={x:0,y:0};const j=document.getElementById('joy'),k=document.getElementById('knob');function moveJoy(e){const t=e.touches?e.touches[0]:e;const q=j.getBoundingClientRect(),x=t.clientX-(q.left+55),y=t.clientY-(q.top+55),len=Math.min(45,Math.hypot(x,y)),a=Math.atan2(y,x);joy.x=Math.cos(a)*len/45;joy.y=Math.sin(a)*len/45;k.style.left=29+joy.x*25+'px';k.style.top=29+joy.y*25+'px'}j.addEventListener('touchstart',moveJoy);j.addEventListener('touchmove',moveJoy);j.addEventListener('touchend',()=>{joy={x:0,y:0};k.style.left='29px';k.style.top='29px'});let last=performance.now();function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;let x=(keys.d?1:0)-(keys.a?1:0)+joy.x,y=(keys.s?1:0)-(keys.w?1:0)+joy.y;const len=Math.hypot(x,y)||1;x/=len;y/=len;p.position.x+=x*6*dt;p.position.z+=y*6*dt;if(x||y)p.rotation.y=Math.atan2(x,y);for(const q of crystals){if(q.parent&&q.position.distanceTo(p.position)<1.25){energy++;s.remove(q);q.userData.dead=1}}for(const e of enemies){if(e.parent){e.rotation.y+=dt;e.position.x=e.userData.home.x+Math.sin(now*.001+e.id)*1.7;e.position.z=e.userData.home.z+Math.cos(now*.0012+e.id)*1.5;if(e.position.distanceTo(p.position)<1.5)hp=Math.max(0,hp-18*dt)}}c.position.lerp(new THREE.Vector3(p.position.x,5.4,p.position.z+8),.12);c.lookAt(p.position.x,1,p.position.z);document.getElementById('e').textContent=energy;document.getElementById('h').textContent=Math.floor(hp);document.getElementById('l').textContent=lv;r.render(s,c);requestAnimationFrame(loop)}requestAnimationFrame(loop);addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});</script></body></html>
