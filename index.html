  log('🌍 Новая Земля создана. AION начинает развитие мира.');
  setTimeout(()=>{b.textContent='💥 Большой взрыв'},2500);
 }catch(e){
  W.visible=true;
  b.textContent='💥 Повторить Большой взрыв';
  log('❌ Перерождение не завершено: '+e.message);

}
async function loadAION(){
 try{
  const r=await fetch(AION_SERVER+'/world',{cache:'no-store'});
  if(!r.ok) throw new Error('AION '+r.status);
  serverState=await r.json(); serverConnected=true;
  evolution=serverState.evolution||evolution;
  if(serverState.universeClock) evolution.universeClock=serverState.universeClock;
  applyTerrainSeed(serverState.universe?.worldSeed);
  applyEvolutionVisuals();
  age=serverState.worldAge||0; cycle=serverState.cycle||0; epoch=serverState.epoch||'Большой взрыв'; births=serverState.births||0; deaths=serverState.deaths||0;
  document.getElementById('ep').textContent=epoch;
  for(const a of [...agents]){a.g.removeFromParent();a.alive=false}
  agents.length=0;settlements.length=0;
  (serverState.population||[]).slice(0,20).forEach(x=>{const a=agent();a.name=x.name||a.name;a.age=x.age||0;a.job=x.job||a.job;a.health=x.health||100;a.children=x.children||0;if(Number.isFinite(+x.x)){a.g.position.x=+x.x;a.g.position.z=Number.isFinite(+x.z)?+x.z:0;a.g.position.y=Number.isFinite(+x.y)?+x.y:terrainHeight(a.g.position.x,a.g.position.z);}});
  (serverState.settlements||[]).forEach((x,i)=>{const a=agents[i%Math.max(1,agents.length)];if(a)house(a)});
  log('AION подключён к постоянному серверному миру. Земля создаётся с нуля. Поколение автономии: '+(evolution.generation||1)+'.');
 }catch(e){serverConnected=false;log('AION Server временно недоступен. Ожидание синхронизации…')}
}

async function uploadPhysicsColliders(){try{const colliders=staticColliders.map((s,i)=>({id:s.id||(`${s.type||'object'}-${i}`),x:s.g.position.x,y:s.g.position.y,z:s.g.position.z,radius:s.radius||.5,height:s.height||1}));await fetch(AION_SERVER+'/physics/colliders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({colliders}),cache:'no-store'});}catch(e){}}

document.getElementById('resetBtn').addEventListener('click',bigBang);setTimeout(()=>{loadAION();setTimeout(uploadPhysicsColliders,1800)},1200); setInterval(loadAION,5000);
function persist(){return Promise.resolve()}
function reproduce(){let L=live().filter(a=>a.age>18&&a.food>55);if(L.length<2||L.length>=20)return;if(Math.random()<.12){let p=L[Math.floor(Math.random()*L.length)],q=L[Math.floor(Math.random()*L.length)];if(p!==q&&p.g.position.distanceTo(q.g.position)<4){const c=agent();c.g.position.copy(p.g.position);c.home=p.home? p.home.clone():null;c.g.position.y=terrainHeight(c.g.position.x,c.g.position.z);p.partner=q.name;p.children++;q.children++;log(p.name+' и '+q.name+' создали семью. Родилось новое поколение.')}}}

// Civilization simulation: trade routes, factions and rivalries.
function ensureFactions(){for(let i=0;i<settlements.length;i++){if(settlements[i].faction===undefined)settlements[i].faction=i%4;}}
function drawRelations(){
 ensureFactions();
 for(let i=0;i<settlements.length;i++)for(let j=i+1;j<settlements.length;j++){
  const a=settlements[i],b=settlements[j],dx=b.g.position.x-a.g.position.x,dz=b.g.position.z-a.g.position.z,d=Math.hypot(dx,dz);
  if(d>55||!a.level||!b.level||a.relationLine)continue;
  if(a.faction===b.faction)continue;
  const rel=Math.random()<.7?'trade':'rivalry';
  a.relationLine={b,rel};
  const mat=new THREE.MeshBasicMaterial({color:rel==='trade'?0x5bc0eb:0xc65c5c,transparent:true,opacity:.55});
  const line=new THREE.Mesh(new THREE.BoxGeometry(.12,.1,d),mat);
  line.position.set((a.g.position.x+b.g.position.x)/2,.13,(a.g.position.z+b.g.position.z)/2);
  line.rotation.y=Math.atan2(dx,dz);W.add(line);
  log(rel==='trade'?'🤝 '+a.founder+' и '+b.founder+' открыли торговый путь.':'⚔️ '+a.founder+' и '+b.founder+' стали соперниками.');
 }
}
function evolve(){let p=live().length,s=settlements.length;let n=p>15&&s>3?'Цивилизация':p>9&&s>1?'Развитие общества':p>4?'Зарождение':'Пробуждение';if(n!==epoch){epoch=n;document.getElementById('ep').textContent=n;log('AION: наступила новая эпоха — '+n)}if(cycle%10===0)drawRelations();}
function tick(dt){age+=dt;if(serverConnected)return;for(const a of agents)if(a.alive)act(a,dt);acc+=dt;if(acc>2){acc=0;cycle++;if(live().length<3)agent();else if(live().length<12&&Math.random()<.7)agent();reproduce();evolve();if(cycle%4===0){let a=live()[Math.floor(Math.random()*live().length)];if(a)log(a.name+' '+a.job+' самостоятельно принимает решение и продолжает свой путь')}if(cycle%8===0)log('AION анализирует '+live().length+' жителей, '+settlements.length+' поселений и '+resources.filter(r=>r.g.visible).length+' источников ресурсов')}}
document.getElementById('hudToggle').onclick=()=>document.getElementById('panel').classList.toggle('open');
function updateWorldClockUI(){const c=serverState?.universeClock||{};const years=Number.isFinite(+c.simulatedYears)?+c.simulatedYears:(age/86400*100);const y=Math.max(0,years);document.getElementById('worldYear').textContent=y<1000?y.toFixed(1):Math.floor(y).toLocaleString('ru-RU');}
function loop(){requestAnimationFrame(loop);let n=performance.now();let dt=Math.min(.05,(n-(loop.last||n))/1000);loop.last=n;tick(dt);if(!loop.nextUI||n>loop.nextUI){loop.nextUI=n+500;updateWorldClockUI();document.getElementById('state').innerHTML='Жители: '+live().length+' / '+agents.length+'<br>Поселения: '+settlements.length+'<br>Рождений: '+births+' · Смертей: '+deaths+'<br>Ресурсов: '+resources.filter(r=>r.g.visible).length+'<br>AION: поколение '+(evolution.generation||1)+' · '+(evolution.strategy||'исследование')+'<br>Память: '+events.length+' событий';}W.rotation.y+=dt*.006;stars.rotation.y-=dt*.0008;updateWildlife(dt);updateSettlements(dt);physicsStep(dt);S.fog=null;camDist=Math.max(35,Math.min(500,camDist));C.position.set(camTarget.x+Math.sin(camYaw)*Math.cos(camPitch)*camDist,camTarget.y+Math.sin(camPitch)*camDist,camTarget.z+Math.cos(camYaw)*Math.cos(camPitch)*camDist);C.lookAt(camTarget);R.render(S,C)}

function camMove(dx,dz){camTarget.x+=dx;camTarget.z+=dz}let drag=false,px=0,py=0,lastPinch=0;R.domElement.addEventListener('wheel',e=>{e.preventDefault();camDist=Math.max(35,Math.min(500,camDist+e.deltaY*.18))},{passive:false});R.domElement.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;R.domElement.setPointerCapture?.(e.pointerId)});R.domElement.addEventListener('pointerup',e=>{drag=false;R.domElement.releasePointerCapture?.(e.pointerId)});R.domElement.addEventListener('pointercancel',()=>drag=false);addEventListener('pointermove',e=>{if(!drag)return;camYaw-=(e.clientX-px)*.008;camPitch=Math.max(.15,Math.min(1.35,camPitch+(e.clientY-py)*.006));px=e.clientX;py=e.clientY});addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});loop();</script></body></html>
