<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>AION — Живая Вселенная V6</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#02040a;color:#fff;font-family:system-ui}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none}#resetBtn{position:absolute;right:14px;top:92px;pointer-events:auto;border:1px solid #ffffff33;border-radius:12px;background:#120b10e8;color:#fff;padding:10px 12px;font-weight:700;cursor:pointer}#panel{position:absolute;left:14px;top:14px;background:#050810e8;border:1px solid #ffffff22;border-radius:16px;padding:14px;min-width:275px;backdrop-filter:blur(8px)}#panel b{font-size:20px}#epoch{position:absolute;right:14px;top:14px;background:#050810e8;border:1px solid #ffffff22;border-radius:16px;padding:13px;min-width:180px}#log{position:absolute;left:14px;bottom:14px;width:min(92vw,470px);max-height:180px;overflow:hidden;background:#050810dd;border:1px solid #ffffff18;border-radius:14px;padding:10px;font-size:12px}.event{margin:4px 0;color:#c7d5e5}#god{position:absolute;right:14px;bottom:14px;background:#050810dd;border:1px solid #ffffff22;border-radius:14px;padding:12px;max-width:250px}.meter{height:5px;background:#222;border-radius:9px;margin-top:3px}.fill{height:100%;background:#65e7ff;border-radius:9px}</style></head><body><div id="ui"><div id="panel"><b>🤖 AION</b><div id="state"></div></div><div id="epoch"><small>ЭПОХА</small><br><strong id="ep">Большой взрыв</strong></div><div id="god">👁️ <b>Аватар Бога</b><br><small>Мир развивается самостоятельно. Наблюдай.</small></div><button id="resetBtn">💥 Большой взрыв</button><div id="log"></div></div>
<script type="module">import*as THREE from'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const S=new THREE.Scene();S.background=new THREE.Color(0x02040a);S.fog=new THREE.Fog(0x02040a,30,90);
const C=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,160);C.position.set(0,34,42);
const R=new THREE.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,1.6));document.body.appendChild(R.domElement);
S.add(new THREE.HemisphereLight(0x9db9ff,0x101810,1.8));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(15,25,10);S.add(sun);
const W=new THREE.Group();S.add(W);
const ocean=new THREE.Mesh(new THREE.PlaneGeometry(260,260,1,1),new THREE.MeshStandardMaterial({color:0x071a2c,roughness:.75,metalness:.05}));
ocean.rotation.x=-Math.PI/2;ocean.position.y=-1.15;W.add(ocean);
const geo=new THREE.PlaneGeometry(210,210,96,96), pos=geo.attributes.position;
for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getY(i);const edge=Math.min(1,Math.hypot(x,z)/105);let h=(Math.sin(x*.075)*1.7+Math.cos(z*.065)*1.4+Math.sin((x+z)*.12)*.8)*(1-edge*.55);h+=Math.max(0,Math.sin(x*.18+z*.11))*1.2;pos.setZ(i,Math.max(-.35,h));}
geo.computeVertexNormals();
const ground=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x345f3a,roughness:.96,metalness:.02}));ground.rotation.x=-Math.PI/2;ground.position.y=-.1;W.add(ground);
const mountainGeo=new THREE.ConeGeometry(3.5,7,8),mountainMat=new THREE.MeshStandardMaterial({color:0x65716a,roughness:1});
for(let i=0;i<18;i++){const m=new THREE.Mesh(mountainGeo,mountainMat);let a=i*2.399,d=18+(i%6)*11;m.position.set(Math.cos(a)*d,3.2,Math.sin(a)*d);m.scale.y=.6+(i%4)*.25;W.add(m);}

const agents=[],settlements=[],resources=[],events=[];let age=0,cycle=0,acc=0,epoch='Большой взрыв',deaths=0,births=0;let serverConnected=false;let evolution={visualQuality:1,terrainScale:1,lightIntensity:1,fogDistance:90,colorMood:'natural',generation:1};
const names=['Ари','Нова','Тар','Лум','Кай','Сел','Ори','Вен','Мира','Рен','Лио','Эна'];
function log(t){events.unshift(t);if(events.length>10)events.pop();document.getElementById('log').innerHTML=events.map(e=>'<div class="event">• '+e+'</div>').join('')}
function applyEvolutionVisuals(){
 const q=Math.max(.7,Math.min(1.5,evolution.visualQuality||1));
 S.fog.far=Math.max(60,evolution.fogDistance||90);
 sun.intensity=2.2*(evolution.lightIntensity||1)*q;
 ground.scale.set(evolution.terrainScale||1,1,evolution.terrainScale||1);
 R.setPixelRatio(Math.min(devicePixelRatio,Math.min(2,1.25+q*.35)));
 if(evolution.colorMood==='civilization'){S.background.setHex(0x07101a);S.fog.color.setHex(0x07101a);}
}

function M(c){return new THREE.MeshStandardMaterial({color:c,roughness:.72,metalness:.02})}
function resource(){let g=new THREE.Mesh(new THREE.OctahedronGeometry(.35),M(0x44c9df));let a=Math.random()*6.28,d=3+Math.random()*22;g.position.set(Math.cos(a)*d,.35,Math.sin(a)*d);W.add(g);resources.push({g,amount:100})}
for(let i=0;i<80;i++)resource();
function agent(parent){
 const g=new THREE.Group(),body=new THREE.Mesh(new THREE.CapsuleGeometry(.32,.62,5,9),M(parent?0x6878a8:0x4e8d6e)),head=new THREE.Mesh(new THREE.SphereGeometry(.25,12,9),M(0x9bc3aa));body.position.y=.62;head.position.y=1.28;g.add(body,head);
 let a=Math.random()*6.28,d=4+Math.random()*18;g.position.set(Math.cos(a)*d,0,Math.sin(a)*d);W.add(g);
 const x={g,name:names[agents.length%names.length]+'-'+(agents.length+1),age:0,food:80,water:80,energy:90,health:100,job:['охотник','собиратель','строитель','исследователь'][Math.floor(Math.random()*4)],goal:null,home:null,partner:null,children:0,memory:[],alive:true};
 agents.push(x);births++;log(x.name+' родился. Профессия: '+x.job);return x
}
function house(a){if(settlements.length>8)return;let g=new THREE.Group(),b=new THREE.Mesh(new THREE.BoxGeometry(2,1.4,2),M(0x806347)),r=new THREE.Mesh(new THREE.ConeGeometry(1.7,1.1,4),M(0x3f5360));b.position.y=.7;r.position.y=1.9;g.add(b,r);g.position.copy(a.g.position);W.add(g);const s={g,founder:a.name,pop:1,age:0};settlements.push(s);a.home=g.position.clone();log(a.name+' построил дом и основал поселение');}
function nearestRes(a){let best=null,bd=1e9;for(const r of resources){let d=a.g.position.distanceTo(r.g.position);if(d<bd){bd=d;best=r}}return best}
function move(a,t,dt,s=1.1){let dx=t.x-a.g.position.x,dz=t.z-a.g.position.z,l=Math.hypot(dx,dz)||1;if(l>.4){a.g.position.x+=dx/l*s*dt;a.g.position.z+=dz/l*s*dt;a.g.rotation.y=Math.atan2(dx,dz)}}
function live(){return agents.filter(a=>a.alive)}
function act(a,dt){
 a.age+=dt;a.food-=dt*.42;a.water-=dt*.25;a.energy-=dt*.18;
 if(a.food<0||a.water<0){a.health-=dt*1.4}
 if(a.health<=0){a.alive=false;a.g.visible=false;deaths++;log(a.name+' умер. Его история сохранена в памяти AION.');return}
 if(a.food<35||a.water<30){let r=nearestRes(a);if(r){a.goal=r.g.position.clone();move(a,a.goal,dt,2.0);if(a.g.position.distanceTo(r.g.position)<1.1){a.food=Math.min(100,a.food+38);a.water=Math.min(100,a.water+22);r.amount-=35;if(r.amount<=0){r.g.visible=false}}}return}
 if(!a.home&&a.age>8&&Math.random()<dt*.025)house(a);
 if(a.home&&a.age>12&&Math.random()<dt*.008&&settlements.length<8)house(a);
 if(a.energy<20){a.goal=a.home||new THREE.Vector3();move(a,a.goal,dt,1.5);if(a.g.position.distanceTo(a.goal)<1.2)a.energy=90;return}
 if(!a.goal||a.g.position.distanceTo(a.goal)<.8){let ang=Math.random()*6.28,d=4+Math.random()*10;a.goal=(a.home||new THREE.Vector3()).clone();a.goal.x+=Math.cos(ang)*d;a.goal.z+=Math.sin(ang)*d}
 move(a,a.goal,dt,a.job==='исследователь'?1.45:1.15);
 if(Math.random()<dt*.012)a.memory.push({cycle,message:'исследовал новую область'});
}
const AION_SERVER='https://aion-server-b80c.onrender.com';
let serverState=null;
async function bigBang(){
 if(!confirm('Начать новую вселенную? Все жители, поселения и история текущего мира будут сброшены.')) return;
 const b=document.getElementById('resetBtn'); b.disabled=true; b.textContent='💥 Создание Земли…';
 try{
  const r=await fetch(AION_SERVER+'/world/reset?confirm=BIG_BANG',{method:'POST',cache:'no-store'});
  if(!r.ok) throw new Error('reset '+r.status);
  const data=await r.json();
  if(!data.ok) throw new Error(data.message||'reset failed');
  log('💥 БОЛЬШОЙ ВЗРЫВ. Старая вселенная завершена.');
  log('🌑 Пустота. AION начинает создавать Землю с нуля.');
  W.visible=false; await new Promise(x=>setTimeout(x,900)); W.visible=true;
  await loadAION();
  log('🌍 Новая Земля создана. AION начинает заселение и развитие.');
 }catch(e){log('❌ Не удалось перезапустить вселенную: '+e.message)}finally{b.disabled=false;b.textContent='💥 Большой взрыв'}
}
async function loadAION(){
 try{
  const r=await fetch(AION_SERVER+'/world',{cache:'no-store'});
  if(!r.ok) throw new Error('AION '+r.status);
  serverState=await r.json(); serverConnected=true;
  evolution=serverState.evolution||evolution;
  applyEvolutionVisuals();
  age=serverState.worldAge||0; cycle=serverState.cycle||0; epoch=serverState.epoch||'Большой взрыв'; births=serverState.births||0; deaths=serverState.deaths||0;
  document.getElementById('ep').textContent=epoch;
  for(const a of [...agents]){a.g.removeFromParent();a.alive=false}
  agents.length=0;settlements.length=0;
  (serverState.population||[]).slice(0,20).forEach(x=>{const a=agent();a.name=x.name||a.name;a.age=x.age||0;a.job=x.job||a.job;a.health=x.health||100;a.children=x.children||0});
  (serverState.settlements||[]).forEach((x,i)=>{const a=agents[i%Math.max(1,agents.length)];if(a)house(a)});
  log('AION подключён к постоянному серверному миру. Земля создаётся с нуля. Поколение автономии: '+(evolution.generation||1)+'.');
 }catch(e){serverConnected=false;log('AION Server временно недоступен. Ожидание синхронизации…')}
}
document.getElementById('resetBtn').addEventListener('click',bigBang);setTimeout(()=>loadAION(),1200); setInterval(loadAION,5000);
function persist(){return Promise.resolve()}
function reproduce(){let L=live().filter(a=>a.age>18&&a.food>55);if(L.length<2||L.length>=20)return;if(Math.random()<.12){let p=L[Math.floor(Math.random()*L.length)],q=L[Math.floor(Math.random()*L.length)];if(p!==q&&p.g.position.distanceTo(q.g.position)<4){const c=agent();c.g.position.copy(p.g.position);c.home=p.home? p.home.clone():null;p.partner=q.name;p.children++;q.children++;log(p.name+' и '+q.name+' создали семью. Родилось новое поколение.')}}}
function evolve(){let p=live().length,s=settlements.length;let n=p>15&&s>3?'Цивилизация':p>9&&s>1?'Развитие общества':p>4?'Зарождение':'Пробуждение';if(n!==epoch){epoch=n;document.getElementById('ep').textContent=n;log('AION: наступила новая эпоха — '+n)}}
function tick(dt){age+=dt;if(serverConnected)return;for(const a of agents)if(a.alive)act(a,dt);acc+=dt;if(acc>2){acc=0;cycle++;if(live().length<3)agent();else if(live().length<12&&Math.random()<.7)agent();reproduce();evolve();if(cycle%4===0){let a=live()[Math.floor(Math.random()*live().length)];if(a)log(a.name+' '+a.job+' самостоятельно принимает решение и продолжает свой путь')}if(cycle%8===0)log('AION анализирует '+live().length+' жителей, '+settlements.length+' поселений и '+resources.filter(r=>r.g.visible).length+' источников ресурсов')}}
function loop(){requestAnimationFrame(loop);let n=performance.now();let dt=Math.min(.05,(n-(loop.last||n))/1000);loop.last=n;tick(dt);if(!loop.nextUI||n>loop.nextUI){loop.nextUI=n+500;document.getElementById('state').innerHTML='Возраст: '+age.toFixed(0)+' с<br>Цикл: '+cycle+'<br>Жители: '+live().length+' / '+agents.length+'<br>Поселения: '+settlements.length+'<br>Рождений: '+births+' · Смертей: '+deaths+'<br>Ресурсов: '+resources.filter(r=>r.g.visible).length+'<br>AION: поколение '+(evolution.generation||1)+' · '+(evolution.strategy||'исследование')+'<br>Память: '+events.length+' событий';}W.rotation.y+=dt*.006;C.lookAt(0,0,0);R.render(S,C)}
log('AION запускается. 3D-мир готов, синхронизация с сервером выполняется…');
for(let i=0;i<2;i++)agent();
addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});loop();</script></body></html>
