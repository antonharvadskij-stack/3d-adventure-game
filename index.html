const geo=new THREE.PlaneGeometry(300,300,128,128), pos=geo.attributes.position;
for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getY(i);const n=Math.sin(x*.045)*1.8+Math.cos(z*.052)*1.5+Math.sin((x+z)*.085)*1.1+Math.sin(x*.17-z*.11)*.55;const continent=Math.sin(x*.031+z*.018)+Math.sin(x*.017-z*.027)*.7+Math.cos(x*.013+z*.041)*.6;let h=n*.7+(continent>.05?(continent-.05)*5.0:continent*.35);h=Math.max(-1.15,h);pos.setZ(i,h);}
let terrainSeed=0;

geo.computeVertexNormals();
const groundMat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.88,metalness:.01});applyTerrainSeed(terrainSeed);const colors=new Float32Array(pos.count*3);for(let i=0;i<pos.count;i++){const h=pos.getZ(i),x=pos.getX(i),z=pos.getY(i),c=new THREE.Color();if(h<-.15)c.setHex(0x6f9360);else if(h<.8)c.setHex((Math.sin(x*.06)+Math.cos(z*.05))>.2?0x4f7f45:0x6f8d4e);else if(h<2.3)c.setHex(0x718b62);else c.setHex(0x87918b);colors[i*3]=c.r;colors[i*3+1]=c.g;colors[i*3+2]=c.b;}geo.setAttribute('color',new THREE.BufferAttribute(colors,3));const ground=new THREE.Mesh(geo,groundMat);ground.rotation.x=-Math.PI/2;ground.position.y=-.05;W.add(ground);
const shore=new THREE.Mesh(new THREE.PlaneGeometry(300,300,1,1),new THREE.MeshStandardMaterial({color:0x8aa36a,transparent:true,opacity:.18,roughness:1}));shore.rotation.x=-Math.PI/2;shore.position.y=.02;W.add(shore);
const mountainGeo=new THREE.ConeGeometry(3.5,7,8),mountainMat=new THREE.MeshStandardMaterial({color:0x65716a,roughness:1});

for(let i=0;i<180;i++){const a=Math.random()*Math.PI*2,d=8+Math.random()*105,x=Math.cos(a)*d,z=Math.sin(a)*d;const h=Math.sin(x*.045+vegetationSeeded)*1.8+Math.cos(z*.052-vegetationSeeded)*1.5+Math.sin((x+z)*.085+vegetationSeeded)*1.1+Math.sin(x*.17-z*.11)*.55;const continent=Math.sin(x*.031+z*.018)+Math.sin(x*.017-z*.027)*.7+Math.cos(x*.013+z*.041)*.6;if(h>-.15&&continent>.05){const g=new THREE.Group();const t=new THREE.Mesh(treeTrunk,new THREE.MeshStandardMaterial({color:0x5b3d28,roughness:1}));const l=new THREE.Mesh(treeTop,new THREE.MeshStandardMaterial({color:0x356b3b,roughness:1}));t.position.y=.6;l.position.y=1.8;g.add(t,l);g.position.set(x,Math.max(h,0),z);g.scale.setScalar(.65+Math.random()*.7);W.add(g);staticColliders.push({g,radius:.65*g.scale.x,height:2.0*g.scale.y,type:'tree'});}}

const riverMeshes=[],lakeMeshes=[];

function rebuildRivers(seed){
 for(const mesh of [...riverMeshes,...lakeMeshes]){W.remove(mesh);mesh.geometry.dispose();}
 riverMeshes.length=0;lakeMeshes.length=0;
 let state=(Number(seed)>>>0)||1;
 const rnd=()=>{state^=state<<13;state^=state>>>17;state^=state<<5;return (state>>>0)/4294967296;};
 for(let i=0;i<7;i++){
  const angle=rnd()*Math.PI*2,startD=8+rnd()*38,length=48+rnd()*72;

  const points=[];
  for(let j=0;j<=count;j++){
   const t=j/count;
   const x=Math.cos(angle)*startD+dx*length*t+Math.sin(t*6+phase)*bend*Math.sin(Math.PI*t);
   const z=Math.sin(angle)*startD+dz*length*t+Math.cos(t*5+phase)*bend*Math.sin(Math.PI*t);
   points.push({x,z});
  }
  const positions=new Float32Array((count+1)*2*3),indices=[];
  for(let j=0;j<=count;j++){
   const prev=points[Math.max(0,j-1)],next=points[Math.min(count,j+1)],p=points[j];
   const tx=next.x-prev.x,tz=next.z-prev.z,len=Math.hypot(tx,tz)||1,nx=-tz/len,nz=tx/len;
   const width=.42+.12*Math.sin(Math.PI*j/count);
   const lx=p.x+nx*width,lz=p.z+nz*width,rx=p.x-nx*width,rz=p.z-nz*width;
   const li=j*6,ri=li+3;
   positions[li]=lx;positions[li+1]=terrainHeight(lx,lz)+.045;positions[li+2]=lz;
   positions[ri]=rx;positions[ri+1]=terrainHeight(rx,rz)+.045;positions[ri+2]=rz;
   if(j<count){const a=j*2,b=a+1,c=a+2,d=a+3;indices.push(a,b,c,b,d,c);}
  }
  const geometry=new THREE.BufferGeometry();
  geometry.setAttribute('position',new THREE.BufferAttribute(positions,3));
  geometry.setIndex(indices);geometry.computeVertexNormals();
  const mesh=new THREE.Mesh(geometry,riverMat);W.add(mesh);riverMeshes.push(mesh);
 }
 for(let i=0;i<5;i++){
  let found=false;
  for(let attempt=0;attempt<60&&!found;attempt++){
   const x=(rnd()-.5)*180,z=(rnd()-.5)*180,h=terrainHeight(x,z);

const camTarget=new THREE.Vector3(0,0,0);let camYaw=0,camPitch=.62,camDist=innerWidth<600?160:110;const agents=[],settlements=[],resources=[],events=[];let age=0,cycle=0,acc=0,epoch='Большой взрыв',deaths=0,births=0;let serverConnected=false;let evolution={visualQuality:1,terrainScale:1,lightIntensity:1,fogDistance:90,colorMood:'natural',generation:1};

// AION visual evolution: the server's autonomous strategy is reflected in the live world.
function applyEvolutionVisuals(){
 const q=Math.max(.7,Math.min(1.5,evolution.visualQuality||1));

function M(c){return new THREE.MeshStandardMaterial({color:c,roughness:.72,metalness:.02})}
function resource(){let g=new THREE.Mesh(new THREE.OctahedronGeometry(.35),M(0x44c9df));let a=Math.random()*6.28,d=3+Math.random()*22;g.position.set(Math.cos(a)*d,.35,Math.sin(a)*d);W.add(g);resources.push({g,amount:100})}
for(let i=0;i<80;i++)resource();
function agent(parent){
 const g=new THREE.Group(),body=new THREE.Mesh(new THREE.CapsuleGeometry(.32,.62,5,9),M(parent?0x6878a8:0x4e8d6e)),head=new THREE.Mesh(new THREE.SphereGeometry(.25,12,9),M(0x9bc3aa));body.position.y=.62;head.position.y=1.28;g.add(body,head);
 let a=Math.random()*6.28,d=4+Math.random()*18;g.position.set(Math.cos(a)*d,0,Math.sin(a)*d);W.add(g);
 const x={g,name:names[agents.length%names.length]+'-'+(agents.length+1),age:0,food:80,water:80,energy:90,health:100,job:['охотник','собиратель','строитель','исследователь'][Math.floor(Math.random()*4)],goal:null,home:null,partner:null,children:0,memory:[],alive:true,radius:.38,height:1.55,mass:1,velocity:new THREE.Vector3(),grounded:true};
 agents.push(x);births++;log(x.name+' родился. Профессия: '+x.job);return x
}
function house(a){if(settlements.length>8)return;let g=new THREE.Group(),b=new THREE.Mesh(new THREE.BoxGeometry(2,1.4,2),M(0x806347)),r=new THREE.Mesh(new THREE.ConeGeometry(1.7,1.1,4),M(0x3f5360));b.position.y=.7;r.position.y=1.9;g.add(b,r);g.position.copy(a.g.position);W.add(g);const s={g,founder:a.name,pop:1,age:0};settlements.push(s);a.home=g.position.clone();log(a.name+' построил дом и основал поселение');}
function nearestRes(a){let best=null,bd=1e9;for(const r of resources){let d=a.g.position.distanceTo(r.g.position);if(d<bd){bd=d;best=r}}return best}
function move(a,t,dt,s=1.1){let dx=t.x-a.g.position.x,dz=t.z-a.g.position.z,l=Math.hypot(dx,dz)||1;if(l>.4){a.velocity.x=dx/l*s;a.velocity.z=dz/l*s;a.g.rotation.y=Math.atan2(dx,dz)}else{a.velocity.x=0;a.velocity.z=0}}
function live(){return agents.filter(a=>a.alive)}

function connectSettlements(){
 if(settlements.length<2)return;
 for(let i=0;i<settlements.length-1;i++){
  const a=settlements[i],b=settlements[i+1]; if(a.roadTo&&a.roadTo===b)continue;
  const dx=b.g.position.x-a.g.position.x,dz=b.g.position.z-a.g.position.z,len=Math.hypot(dx,dz); if(len<4)continue;
  const road=new THREE.Mesh(new THREE.BoxGeometry(.55,.08,len),M(0x5b5147));
  road.position.set((a.g.position.x+b.g.position.x)/2,.06,(a.g.position.z+b.g.position.z)/2);
  road.rotation.y=Math.atan2(dx,dz);W.add(road);settlementRoads.push(road);a.roadTo=b;
 }
}
function applyVisualWorldSeed(seed){
 const s=(Number(seed)>>>0)||1;
 let state=s;
 const rnd=()=>{state^=state<<13;state^=state>>>17;state^=state<<5;return ((state>>>0)/4294967296);};
 const place=(g,spread=105)=>{let tries=0;while(tries++<80){const a=rnd()*Math.PI*2,d=8+rnd()*spread,x=Math.cos(a)*d,z=Math.sin(a)*d;const h=terrainHeight(x,z);const continent=Math.sin(x*.031+z*.018)+Math.sin(x*.017-z*.027)*.7+Math.cos(x*.013+z*.041)*.6;if(h>-.15&&continent>.02){g.position.set(x,Math.max(h,0),z);return;}}g.position.set((rnd()-.5)*120,0,(rnd()-.5)*120);};
 staticColliders.filter(x=>x.type==='tree').forEach(s=>place(s.g));
 naturalResources.forEach(r=>place(r.g));
 worldSettlements.forEach(q=>place(q.g));
 animals.forEach(a=>{place(a.g);a.phase=rnd()*Math.PI*2;});
}
function updateSettlements(dt){
 for(const q of worldSettlements)q.g.rotation.y+=dt*.05;
 for(const s of settlements){
  s.age=(s.age||0)+dt;
  const residents=live().filter(a=>a.home&&a.g.position.distanceTo(s.g.position)<3.5).length;
  s.pop=Math.max(s.pop||1,residents);
  if(!s.level)s.level=1;
  const target=s.pop>=10?3:s.pop>=5?2:1;
  if(target>s.level){
   s.level=target; log(s.level===2?s.founder+' поселение выросло в деревню.':s.founder+' поселение стало городским центром.');
   for(let j=0;j<s.level+1;j++){
    const g=new THREE.Group(),b=new THREE.Mesh(new THREE.BoxGeometry(1.3,1.1,1.3),M(0x806347)),r=new THREE.Mesh(new THREE.ConeGeometry(1.1,.8,4),M(0x465866));
    const ang=j*2.1;g.position.set(s.g.position.x+Math.cos(ang)*(2+s.level),.05,s.g.position.z+Math.sin(ang)*(2+s.level));b.position.y=.55;r.position.y=1.45;g.add(b,r);W.add(g);
   }
  }
 }

const AION_SERVER=window.location.origin;
async function aionFetch(path, options={}, attempts=12){
  let lastError;
  for(let i=0;i<attempts;i++){
    try{
      const r=await fetch(AION_SERVER+path,{...options,cache:'no-store'});
      if(r.ok) return r;
      lastError=new Error('HTTP '+r.status);
    }catch(e){ lastError=e; }
    if(i+1<attempts) await new Promise(resolve=>setTimeout(resolve,Math.min(15000,2500*Math.pow(1.35,i))));
  }
  throw lastError || new Error('AION server unavailable');
}
