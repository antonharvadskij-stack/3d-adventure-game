services:
  - type: web
    name: aion-server
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./aion-server/Dockerfile
    dockerContext: ./aion-server
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aion-world-db
          property: connectionString
databases:
  - name: aion-world-db
    plan: free
    region: singapore
