# AION isolated timing-diagnostics Blueprint.
# Apply only after Render allows a separate QA PostgreSQL instance.
# This file intentionally defines no production service or production database.
services:
  - type: web
    name: aion-server-qa-timing
    runtime: docker
    plan: free
    numInstances: 1
    region: singapore
    branch: aion/isolated-timing-diagnostics
    dockerfilePath: ./aion-server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aion-qa-timing-db
          property: connectionString

databases:
  - name: aion-qa-timing-db
    plan: free
    region: singapore
